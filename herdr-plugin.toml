id = "homur.recap"
name = "Recap"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Keep track of your agents: a recap popup, and a newest-first Agents sidebar"
platforms = ["linux", "macos"]

[[panes]]
id = "recap"
title = "Agent recap"
placement = "popup"
width = "90%"
height = "90%"
command = ["python3", "-I", "recap.py"]

[[actions]]
id = "open"
title = "Show agent recap"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin \"$HERDR_PLUGIN_ID\" --entrypoint recap"]

[[actions]]
id = "toggle-sort"
title = "Agents sidebar: newest first on/off"
contexts = ["workspace"]
command = ["python3", "-I", "sort.py", "toggle"]

[[startup]]
command = ["python3", "-I", "sort.py", "apply"]
